<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FEF7EF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>BOBOY — Menu</title>
<link rel="icon" href="/img/brand/logo.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="preload" href="/fonts/oswald-cyrillic-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/fonts/oswald-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- ============ SPLASH ============ -->
<section id="splash" class="screen splash is-active" aria-label="BOBOY">
  <div class="splash__lang" data-lang-switch></div>
  <div class="splash__center">
    <img class="splash__logo" src="/img/brand/logo.png" alt="BOBOY — Proudly Uzbek">
    <p class="splash__tagline" data-t="tagline"></p>
  </div>
  <p class="splash__hint" data-t="tap"></p>
</section>

<!-- ============ MENU ============ -->
<section id="app" class="screen app" aria-label="Menu">
  <header class="topbar">
    <button class="icon-btn topbar__back" id="backBtn" aria-label="Back">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <button class="topbar__brand" id="brandBtn" aria-label="BOBOY">
      <img src="/img/brand/logo.png" alt="BOBOY">
    </button>
    <h1 class="topbar__title" id="topTitle"></h1>
    <div class="topbar__lang" data-lang-switch></div>
  </header>

  <!-- categories grid (home) -->
  <main class="view view--home" id="viewHome">
    <div class="home-head">
      <h2 class="home-head__title" data-t="menu"></h2>
      <p class="home-head__sub" data-t="tagline"></p>
    </div>
    <div class="cat-grid" id="catGrid"></div>
    <div class="home-foot" aria-hidden="true">
      <img src="/img/art/caravan.webp" alt="">
    </div>
  </main>

  <!-- one category: pills + dishes -->
  <main class="view view--cat" id="viewCat">
    <nav class="pills" id="pills" aria-label="Categories"></nav>
    <div class="dish-list" id="dishList"></div>
  </main>
</section>

<!-- ============ DISH ============ -->
<section id="dish" class="dish" aria-modal="true" role="dialog" aria-hidden="true">
  <div class="dish__scroll">
    <div class="dish__media" id="dishMedia"></div>
    <div class="dish__card">
      <h2 class="dish__name" id="dishName"></h2>
      <div class="dish__price" id="dishPrice"></div>
      <p class="dish__desc" id="dishDesc"></p>
    </div>
  </div>
  <button class="icon-btn dish__back" id="dishBack" aria-label="Back">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
  </button>
</section>

<div class="offline" id="offline" hidden></div>

<script src="/js/app.js"></script>
</body>
</html>
